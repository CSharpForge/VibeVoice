# VibeVoice + LiveKit OSS, for a server that already runs Nginx Proxy Manager
# in the compose project "nginx-proxy" (network: nginx-proxy_default).
#
# Container logs are capped (json-file, 2 x 5 MB) so they rotate quickly.
# Secrets live in ./.env (never committed): APP_SECRET, LK_API_KEY, LK_API_SECRET.

services:
  vibevoice:
    build: ./src
    image: vibevoice:latest
    container_name: vibevoice
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      APP_SECRET: ${APP_SECRET}
      LIVEKIT_URL: wss://lk.agiledeck.org
      LIVEKIT_API_KEY: ${LK_API_KEY}
      LIVEKIT_API_SECRET: ${LK_API_SECRET}
      ROOM_TOKEN_TTL_SECONDS: "3600"
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  livekit:
    # Official image, pinned. Host networking is what LiveKit recommends so the
    # advertised media ports match the real ones (7880 signalling, 7881/tcp, 7882/udp).
    image: livekit/livekit-server:v1.13.11
    container_name: livekit
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LK_API_KEY}: ${LK_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

networks:
  proxy:
    name: nginx-proxy_default
    external: true
